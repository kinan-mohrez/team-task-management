services:
  postgres:
    image: postgres:16
    container_name: team-task-postgres-compose
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: team-task-backend-compose
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: team-task-frontend-compose
    ports:
      - '4200:80'
    depends_on:
      - backend

volumes:
  postgres_data:
