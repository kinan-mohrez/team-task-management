<mat-card>
  <mat-card-header>
    <mat-card-title>Tasks</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="task-list-actions">
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="addTask()"
      >
        <mat-icon>add</mat-icon>
        Add Task
      </button>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Search tasks</mat-label>

      <input
        matInput
        [(ngModel)]="searchValue"
        (keyup)="applyFilter()"
        placeholder="Search by title, status, priority..."
      />

      <button
        *ngIf="searchValue"
        matSuffix
        mat-icon-button
        type="button"
        (click)="searchValue = ''; applyFilter()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
        <td mat-cell *matCellDef="let task">
          {{ task.title }}
        </td>
      </ng-container>

      <ng-container matColumnDef="project">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Project</th>
        <td mat-cell *matCellDef="let task">
          {{ getProjectName(task.projectId) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="assignedUser">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Assigned User</th>
        <td mat-cell *matCellDef="let task">
          {{ getAssignedUserName(task.assignedUserId) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let task">
          {{ task.status }}
        </td>
      </ng-container>

      <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
        <td mat-cell *matCellDef="let task">
          {{ task.priority }}
        </td>
      </ng-container>

      <ng-container matColumnDef="dueDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Due Date</th>
        <td mat-cell *matCellDef="let task">
          {{ task.dueDate | date: "mediumDate" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let task">
          <button
            mat-icon-button
            color="primary"
            type="button"
            aria-label="Edit task"
            (click)="editTask(task)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            type="button"
            aria-label="Delete task"
            (click)="deleteTask(task)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
    >
    </mat-paginator>
  </mat-card-content>
</mat-card>
