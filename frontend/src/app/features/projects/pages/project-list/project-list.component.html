<div class="page-container">
  <div class="page-header">
    <h1>Projects</h1>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="addProject()"
    >
      Add Project
    </button>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Search projects</mat-label>

    <input
      matInput
      type="search"
      autocomplete="off"
      placeholder="Search by name or description"
      [value]="searchValue"
      (input)="onSearch($event)"
    />

    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <button
    mat-stroked-button
    type="button"
    (click)="onRefresh()"
    [disabled]="isLoading"
  >
    <mat-icon>refresh</mat-icon>
    Refresh
  </button>

  <button
    mat-stroked-button
    type="button"
    (click)="onClearFilters()"
    [disabled]="!hasActiveFilters"
  >
    <mat-icon>filter_alt_off</mat-icon>
    Clear filters
  </button>

  <div *ngIf="isLoading">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <table
    mat-table
    matSort
    [dataSource]="dataSource"
    [matSortActive]="sortField"
    [matSortDirection]="sortDirection"
    (matSortChange)="onSortChange($event)"
  >
    <ng-container matColumnDef="id">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header="id"
      >
        ID
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header="name"
      >
        Name
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header="description"
      >
        Description
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.description }}
      </td>
    </ng-container>

    <ng-container matColumnDef="startDate">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header="startDate"
      >
        Start Date
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.startDate }}
      </td>
    </ng-container>

    <ng-container matColumnDef="endDate">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header="endDate"
      >
        End Date
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.endDate }}
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header="status"
      >
        Status
      </th>

      <td mat-cell *matCellDef="let project">
        {{ project.status }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let project">
        <button
          mat-icon-button
          color="accent"
          [routerLink]="['/projects', project.id]"
        >
          <mat-icon>visibility</mat-icon>
        </button>

        <button
          mat-icon-button
          color="primary"
          [routerLink]="['/projects', project.id, 'edit']"
        >
          <mat-icon>edit</mat-icon>
        </button>

        <button
          mat-icon-button
          color="warn"
          type="button"
          (click)="deleteProject(project)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
    ></tr>

    <tr *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length">
        No projects found.
      </td>
    </tr>
  </table>

  <mat-paginator
    [length]="totalItems"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    [showFirstLastButtons]="true"
    (page)="onPageChange($event)"
    aria-label="Select projects page"
  >
  </mat-paginator>
</div>
