<mat-card>
  <mat-card-header>
    <mat-card-title>
      {{ isEditMode ? 'Edit Team' : 'Create Team' }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="save()">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>

        <input
          matInput
          formControlName="name"
        />

        <mat-error *ngIf="form.get('name')?.hasError('required')">
          Name is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>

        <textarea
          matInput
          rows="4"
          formControlName="description">
        </textarea>
      </mat-form-field>

      <div class="form-actions">

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isLoading">

          {{ isEditMode ? 'Update' : 'Create' }}

        </button>

        <button
          mat-stroked-button
          type="button"
          (click)="cancel()">

          Cancel

        </button>

      </div>

    </form>
  </mat-card-content>
</mat-card>
