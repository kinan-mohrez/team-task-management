<mat-card>
  <mat-card-header>
    <mat-card-title>Teams</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="team-list-actions">
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="addTeam()"
      >
        <mat-icon>add</mat-icon>
        Add Team
      </button>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Search teams</mat-label>

      <input
        matInput
        [(ngModel)]="searchValue"
        (keyup)="applyFilter()"
        placeholder="Search by name or description..."
      />

      <button
        *ngIf="searchValue"
        matSuffix
        mat-icon-button
        type="button"
        (click)="onClearFilters()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>

    <div *ngIf="isLoading">
      <mat-spinner diameter="48"></mat-spinner>
    </div>

    <table
      mat-table
      matSort
      [dataSource]="dataSource"
      [matSortActive]="sortField"
      [matSortDirection]="sortDirection"
      (matSortChange)="onSortChange($event)"
      class="mat-elevation-z2"
    >
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="id">ID</th>

        <td mat-cell *matCellDef="let team">
          {{ team.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="name">Name</th>

        <td mat-cell *matCellDef="let team">
          {{ team.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="description">
          Description
        </th>

        <td mat-cell *matCellDef="let team">
          {{ team.description }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>

        <td mat-cell *matCellDef="let team">
          <button
            mat-icon-button
            color="accent"
            type="button"
            aria-label="View team"
            (click)="viewTeam(team)"
          >
            <mat-icon>visibility</mat-icon>
          </button>

          <button
            mat-icon-button
            color="primary"
            type="button"
            aria-label="Edit team"
            (click)="editTeam(team)"
          >
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            color="warn"
            type="button"
            aria-label="Delete team"
            (click)="deleteTeam(team)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length">No teams found.</td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalItems"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [showFirstLastButtons]="true"
      (page)="onPageChange($event)"
      aria-label="Select teams page"
    >
    </mat-paginator>
  </mat-card-content>
</mat-card>
