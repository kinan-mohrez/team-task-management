<section class="teams-page">
  <header class="page-header">
    <div class="page-heading">
      <h1>Teams</h1>
      <p>Manage teams and organize collaboration across the workspace.</p>
    </div>

    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="addTeam()"
    >
      <mat-icon>add</mat-icon>
      <span>Add Team</span>
    </button>
  </header>

  <mat-card class="teams-card">
    <div class="teams-toolbar">
      <mat-form-field
        appearance="outline"
        class="search-field"
      >
        <mat-label>Search teams</mat-label>

        <input
          matInput
          type="search"
          autocomplete="off"
          placeholder="Search by name or description"
          [value]="searchValue"
          (input)="onSearch($event)"
        />

        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <div class="toolbar-actions">
        <button
          mat-stroked-button
          type="button"
          (click)="onRefresh()"
          [disabled]="isLoading"
        >
          <mat-icon>refresh</mat-icon>
          <span>Refresh</span>
        </button>

        <button
          mat-stroked-button
          type="button"
          (click)="onClearFilters()"
          [disabled]="!hasActiveFilters"
        >
          <mat-icon>filter_alt_off</mat-icon>
          <span>Clear filters</span>
        </button>
      </div>
    </div>

    <div
      class="loading-container"
      *ngIf="isLoading"
    >
      <mat-spinner diameter="48"></mat-spinner>
      <p>Loading teams...</p>
    </div>

    <div class="table-container">
      <table
        mat-table
        matSort
        [dataSource]="dataSource"
        [matSortActive]="sortField"
        [matSortDirection]="sortDirection"
        (matSortChange)="onSortChange($event)"
        class="teams-table"
      >
        <ng-container matColumnDef="id">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header="id"
          >
            ID
          </th>

          <td mat-cell *matCellDef="let team">
            {{ team.id }}
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header="name"
          >
            Name
          </th>

          <td mat-cell *matCellDef="let team">
            {{ team.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header="description"
          >
            Description
          </th>

          <td mat-cell *matCellDef="let team">
            {{ team.description }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="actions-header"
          >
            Actions
          </th>

          <td
            mat-cell
            *matCellDef="let team"
            class="actions-cell"
          >
            <button
              mat-icon-button
              type="button"
              aria-label="View team"
              (click)="viewTeam(team)"
            >
              <mat-icon>visibility</mat-icon>
            </button>

            <button
              mat-icon-button
              color="primary"
              type="button"
              aria-label="Edit team"
              (click)="editTeam(team)"
            >
              <mat-icon>edit</mat-icon>
            </button>

            <button
              mat-icon-button
              color="warn"
              type="button"
              aria-label="Delete team"
              (click)="deleteTeam(team)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
        ></tr>

        <tr *matNoDataRow>
          <td
            class="empty-cell"
            [attr.colspan]="displayedColumns.length"
          >
            <div
              class="empty-state"
              *ngIf="!isLoading"
            >
              <mat-icon>groups</mat-icon>
              <h2>No teams found</h2>
              <p>No teams match the current search criteria.</p>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      class="table-paginator"
      [length]="totalItems"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [showFirstLastButtons]="true"
      (page)="onPageChange($event)"
      aria-label="Select teams page"
    >
    </mat-paginator>
  </mat-card>
</section>
